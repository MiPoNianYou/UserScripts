<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="520" viewBox="0 0 1200 520"
     role="img" aria-labelledby="title desc">
  <title id="title">Quark Pilot：最新在前，全选归零</title>
  <desc id="desc">打开分享页，最新在前，全选归零。左侧对比默认排序参数与修改日期倒序参数，并说明脚本自动取消全选、手动选择后停止干预。右侧为文件列表，修改日期从新到旧排列。</desc>

  <rect width="1200" height="520" rx="16" fill="#f4f1ea"/>

  <!-- 左栏：宣言 + 机制 + 取消全选面板 -->
  <line x1="60" y1="80" x2="60" y2="476" stroke="#1c1a16" stroke-width="2"/>

  <!-- 宣言 -->
  <text x="102" y="100" fill="#1c1a16" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="22" letter-spacing="1.5">打开分享页，</text>
  <text x="98" y="154" fill="#1c1a16" font-family="'Songti SC', 'SimSun', 'Microsoft YaHei', serif" font-weight="900" font-size="46">最新在前</text>
  <text x="98" y="202" fill="#1c1a16" font-family="'Songti SC', 'SimSun', 'Microsoft YaHei', serif" font-weight="900" font-size="46">全选归零。</text>

  <line x1="102" y1="232" x2="518" y2="232" stroke="#1c1a16" stroke-width="1.2"/>

  <!-- 机制：before/after -->
  <g font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">
    <g transform="translate(102,244)">
      <rect width="416" height="76" rx="9" fill="#fffdf8" stroke="#d8d2c0" stroke-width="1.5"/>
      <text x="18" y="25" fill="#57534a" font-size="18" letter-spacing="2">BEFORE</text>
      <text x="18" y="57" font-size="20" fill="#3a352c">…/detail<tspan fill="#b04a3a">?_sort=file_type:asc</tspan></text>
    </g>
    <g transform="translate(102,330)">
      <rect width="416" height="76" rx="9" fill="#1c1a16"/>
      <text x="18" y="25" fill="#d8d2c0" font-size="18" letter-spacing="2">AFTER</text>
      <text x="18" y="57" font-size="20" fill="#f4f1ea">…/detail<tspan fill="#7fb069">?_sort=updated_at:desc</tspan></text>
    </g>
    <g transform="translate(312,320)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#1c1a16" stroke-width="2"/>
      <polygon points="-4,4 0,10 4,4" fill="#1c1a16"/>
    </g>
  </g>

  <!-- 取消全选：独立面板 -->
  <g transform="translate(102,414)">
    <rect width="416" height="62" rx="9" fill="#fffdf8" stroke="#d8d2c0" stroke-width="1.5"/>
    <g transform="translate(30,31)">
      <rect x="-13" y="-13" width="26" height="26" rx="6" fill="#b04a2a"/>
      <polyline points="-6,0 -1.5,6 7,-6" stroke="#fffdf8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(63,31)">
      <line x1="0" y1="0" x2="48" y2="0" stroke="#1c1a16" stroke-width="2.2"/>
      <polygon points="48,-6 60,0 48,6" fill="#1c1a16"/>
    </g>
    <g transform="translate(156,31)">
      <rect x="-13" y="-13" width="26" height="26" rx="6" fill="none" stroke="#b04a2a" stroke-width="2.5"/>
    </g>
    <text x="196" y="27" fill="#3a352c" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600">自动取消全选</text>
    <text x="196" y="51" fill="#57534a" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18">手动选择后停止干预</text>
  </g>

  <!-- 右：分享页列表复刻 -->
  <g transform="translate(560,80)">
    <rect width="592" height="416" rx="14" fill="#fffdf8" stroke="#d8d2c0" stroke-width="1.5"/>
    <g transform="translate(24,24)">
      <g transform="translate(2,-2)" fill="none" stroke="#1B7CFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 18.004H6.657C4.085 18 2 15.993 2 13.517s2.085-4.482 4.657-4.482c.393-1.762 1.794-3.2 3.675-3.773 1.88-.572 3.956-.193 5.444 1 1.488 1.19 2.162 3.007 1.77 4.769h.99c1.396 0 2.6.831 3.148 2.03M19 16l-2 3h4l-2 3"/>
      </g>
      <text x="42" y="17" fill="#1c1a16" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600">Quark Pilot</text>
      <g transform="translate(330,-8)">
        <rect width="214" height="36" rx="18" fill="#b04a2a"/>
        <text x="107" y="24" text-anchor="middle" fill="#fffdf8" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18">最新置顶 · 取消全选</text>
      </g>
    </g>
    <line x1="24" y1="68" x2="568" y2="68" stroke="#ece5d6"/>
    <g transform="translate(24,98)" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18">
      <rect x="0" y="-12" width="17" height="17" rx="4" fill="none" stroke="#b04a2a" stroke-width="2.2"/>
      <text x="34" y="3" fill="#3a352c">文件名</text>
      <text x="414" y="3" text-anchor="end" fill="#3a352c">大小</text>
      <text x="544" y="3" text-anchor="end" fill="#b04a2a" font-weight="600">修改日期 ↓</text>
    </g>
    <line x1="24" y1="116" x2="568" y2="116" stroke="#ece5d6"/>
    <g font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="20">
      <g transform="translate(24,150)">
        <rect x="0" y="-12" width="17" height="17" rx="4" fill="none" stroke="#8a8471" stroke-width="2.4"/>
        <text x="34" y="3" fill="#3a352c">示例文件 A.zip</text>
        <text x="414" y="3" text-anchor="end" fill="#3a352c" font-size="18">24.8M</text>
        <text x="544" y="3" text-anchor="end" fill="#3a352c" font-family="ui-monospace, Consolas, monospace" font-size="18">10-26 14:20</text>
      </g>
      <g transform="translate(24,202)">
        <rect x="0" y="-12" width="17" height="17" rx="4" fill="none" stroke="#8a8471" stroke-width="2.4"/>
        <text x="34" y="3" fill="#3a352c">示例文件 B.pdf</text>
        <text x="414" y="3" text-anchor="end" fill="#3a352c" font-size="18">8.6M</text>
        <text x="544" y="3" text-anchor="end" fill="#3a352c" font-family="ui-monospace, Consolas, monospace" font-size="18">10-23 09:12</text>
      </g>
      <g transform="translate(24,254)">
        <rect x="0" y="-12" width="17" height="17" rx="4" fill="none" stroke="#8a8471" stroke-width="2.4"/>
        <text x="34" y="3" fill="#3a352c">示例文件 C.fig</text>
        <text x="414" y="3" text-anchor="end" fill="#3a352c" font-size="18">3.2M</text>
        <text x="544" y="3" text-anchor="end" fill="#3a352c" font-family="ui-monospace, Consolas, monospace" font-size="18">10-18 18:40</text>
      </g>
      <g transform="translate(24,306)">
        <rect x="0" y="-12" width="17" height="17" rx="4" fill="none" stroke="#8a8471" stroke-width="2.4"/>
        <text x="34" y="3" fill="#3a352c">示例文件 D.xlsx</text>
        <text x="414" y="3" text-anchor="end" fill="#3a352c" font-size="18">96K</text>
        <text x="544" y="3" text-anchor="end" fill="#3a352c" font-family="ui-monospace, Consolas, monospace" font-size="18">10-09 08:05</text>
      </g>
    </g>
  </g>
</svg>










