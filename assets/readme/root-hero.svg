<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="310" viewBox="0 0 1200 310"
     role="img" aria-labelledby="hero-title hero-desc"
     lang="zh-CN" xml:lang="zh-CN">
  <title id="hero-title">少一步 更顺手</title>
  <desc id="hero-desc">个人浏览器工具箱。把常用操作交给浏览器脚本。GPT ThinkOn 在思考开关关闭时点击一次，并在用户点击后停止监听；Quark Pilot 将夸克分享页按修改时间倒序，并在用户选择后停止取消全选。</desc>

  <g aria-hidden="true">
    <rect width="1200" height="310" fill="#f4f0e7"/>

    <text x="54" y="120" fill="#1b1915"
          font-family="'Songti SC', STSong, SimSun, serif"
          font-size="68" font-weight="900" letter-spacing="-2.2">少一步</text>
    <text x="54" y="194" fill="#1b1915"
          font-family="'Songti SC', STSong, SimSun, serif"
          font-size="68" font-weight="900" letter-spacing="-2.2">更顺手</text>
    <text x="54" y="248" fill="#6f685d"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="22">把常用操作交给浏览器脚本。</text>

    <line x1="414" y1="38" x2="414" y2="274" stroke="#d8d0c1"/>

    <circle cx="468" cy="75" r="16" fill="#fbf7ef" fill-opacity=".55" stroke="#d8d0c1"/>
    <g transform="translate(458 65) scale(.8333)" fill="none" stroke="#0b7b60"
       stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11.745 14.85 6.905 12V7c0-2.21 1.825-4 4.076-4 1.397 0 2.63.69 3.365 1.741M9.6 19.18a4.1 4.1 0 0 0 3.42 1.822c2.25 0 4.076-1.791 4.076-4v-5L12.16 9.096M9.451 13.5V7.67l4.413-2.5c1.95-1.105 4.443-.45 5.569 1.463a3.93 3.93 0 0 1 .076 3.866m-15.018 3a3.93 3.93 0 0 0 .075 3.867c1.126 1.913 3.62 2.568 5.569 1.464l4.413-2.5.096-5.596m2.451 6.897a4.09 4.09 0 0 0 3.357-1.997c1.126-1.913.458-4.36-1.492-5.464l-4.413-2.5-5.059 2.755M6.905 6.37a4.09 4.09 0 0 0-3.358 1.997c-1.126 1.914-.458 4.36 1.492 5.464l4.413 2.5 5.048-2.75"/>
    </g>
    <text x="495" y="82" fill="#1b1915"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="20" font-weight="700">GPT ThinkOn</text>
    <text x="1138" y="78" text-anchor="end" fill="#6f685d"
          font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace"
          font-size="14">aria-pressed</text>

    <text x="452" y="119.5" fill="#6f685d"
          font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace"
          font-size="14" letter-spacing=".6">状态</text>
    <text x="514" y="121" fill="#6f685d"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="18">关闭</text>
    <line x1="514" y1="115" x2="550" y2="115" stroke="#b6422b" stroke-width="2"/>
    <path d="M560 115h54m-7-5 7 5-7 5" fill="none" stroke="#b6422b"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="634" y="121.5" fill="#1b1915"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="18" font-weight="700">开启</text>
    <line x1="634" y1="126.5" x2="670" y2="126.5" stroke="#0b7b60" stroke-width="2"/>
    <text x="1138" y="120.5" text-anchor="end" fill="#6f685d"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="15">连续 2 帧稳定后点击一次</text>

    <line x1="452" y1="160" x2="1138" y2="160" stroke="#d8d0c1"/>

    <circle cx="468" cy="190" r="16" fill="#fbf7ef" fill-opacity=".55" stroke="#d8d0c1"/>
    <g transform="translate(458 180) scale(.8333)" fill="none" stroke="#1b6fe5"
       stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 18.004H6.657C4.085 18 2 15.993 2 13.517s2.085-4.482 4.657-4.482c.393-1.762 1.794-3.2 3.675-3.773 1.88-.572 3.956-.193 5.444 1 1.488 1.19 2.162 3.007 1.77 4.769h.99c1.396 0 2.6.831 3.148 2.03M19 16l-2 3h4l-2 3"/>
    </g>
    <text x="495" y="197" fill="#1b1915"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="20" font-weight="700">Quark Pilot</text>
    <text x="1138" y="193.5" text-anchor="end" fill="#6f685d"
          font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace"
          font-size="14">_sort · checked</text>

    <text x="452" y="230.5" fill="#6f685d"
          font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace"
          font-size="14" letter-spacing=".6">排序</text>
    <text x="514" y="232" fill="#6f685d"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="18">默认顺序</text>
    <line x1="514" y1="226" x2="586" y2="226" stroke="#b6422b" stroke-width="2"/>
    <path d="M596 226h18m-7-5 7 5-7 5" fill="none" stroke="#b6422b"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="634" y="232" fill="#1b1915"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="18" font-weight="700">修改日期 ↓</text>
    <line x1="634" y1="238" x2="725" y2="238" stroke="#1b6fe5" stroke-width="2"/>
    <text x="1138" y="230.5" text-anchor="end" fill="#6f685d"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="15">改写 sharepage/detail 请求</text>

    <text x="452" y="267.5" fill="#6f685d"
          font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace"
          font-size="14" letter-spacing=".6">选择</text>
    <text x="514" y="269" fill="#6f685d"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="18">全部勾选</text>
    <line x1="514" y1="263" x2="586" y2="263" stroke="#b6422b" stroke-width="2"/>
    <path d="M596 263h18m-7-5 7 5-7 5" fill="none" stroke="#b6422b"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="634" y="269.5" fill="#1b1915"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="18" font-weight="700">取消全选</text>
    <line x1="634" y1="274.5" x2="706" y2="274.5" stroke="#1b6fe5" stroke-width="2"/>
    <text x="1138" y="268.5" text-anchor="end" fill="#6f685d"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="15">列表稳定 300 ms 后检查</text>

  </g>
</svg>
